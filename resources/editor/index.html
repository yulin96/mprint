<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mprint 模板编辑器</title>
    <link rel="stylesheet" href="/editor/editor.css" />
  </head>
  <body>
    <div class="ambient ambient-left" aria-hidden="true"></div>
    <div class="ambient ambient-right" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24">
              <path
                d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
              />
              <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
              <rect x="6" y="14" width="12" height="8" rx="1" />
            </svg>
          </div>
          <div>
            <h1>打印模板编辑器</h1>
            <p>按毫米配置纸张与打印元素</p>
          </div>
        </div>
        <div class="topbar-context">
          <div id="paperControl" class="paper-control">
            <button
              id="paperSettingsButton"
              class="button button-secondary paper-settings-button"
              type="button"
              aria-expanded="false"
              aria-controls="paperPopover"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 3h12v14H4zM4 7h12M8 3v4" />
              </svg>
              <span>纸张</span>
              <strong id="paperSummary">86 × 54 mm</strong>
            </button>
            <section
              id="paperPopover"
              class="paper-popover t-dropdown"
              data-origin="top-left"
              aria-hidden="true"
              inert
            >
              <div class="popover-heading">
                <div>
                  <h2>纸张设置</h2>
                  <p>选择常用尺寸或输入毫米数值</p>
                </div>
                <button
                  id="closePaperPopover"
                  class="popover-close"
                  type="button"
                  aria-label="关闭纸张设置"
                >
                  <svg viewBox="0 0 20 20" aria-hidden="true">
                    <path d="m5 5 10 10M15 5 5 15" />
                  </svg>
                </button>
              </div>
              <div class="form-grid paper-form-grid">
                <label class="field field-wide">
                  <span>常用尺寸</span>
                  <select id="pagePreset">
                    <option value="card">证卡 86 × 54 mm</option>
                    <option value="A4">A4 210 × 297 mm</option>
                    <option value="A5">A5 148 × 210 mm</option>
                    <option value="A6">A6 105 × 148 mm</option>
                    <option value="photo-6in">照片 102 × 152 mm</option>
                    <option value="custom">自定义</option>
                  </select>
                </label>
                <label class="field"
                  ><span>宽度 mm</span
                  ><input id="pageWidth" type="number" min="1" max="1200" step="0.1"
                /></label>
                <label class="field"
                  ><span>高度 mm</span
                  ><input id="pageHeight" type="number" min="1" max="1200" step="0.1"
                /></label>
                <label class="check field-wide"
                  ><input id="landscape" type="checkbox" /><span>横向打印</span></label
                >
              </div>
            </section>
          </div>
          <label
            class="default-paper-toggle"
            title="打印时使用打印机默认纸张；模板尺寸仍用于布局与预览"
          >
            <input id="useDefaultPageSize" type="checkbox" />
            <span>打印机默认纸张</span>
          </label>
        </div>
        <div class="topbar-actions">
          <span id="message" class="message" role="status"></span>
          <button id="copyButton" class="button button-secondary" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            <span class="button-label">复制当前代码</span>
          </button>
          <button id="previewButton" class="button button-secondary" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7V5a2 2 0 0 1 2-2h2" />
              <path d="M17 3h2a2 2 0 0 1 2 2v2" />
              <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
              <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
              <circle cx="12" cy="12" r="1" />
              <path
                d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0"
              />
            </svg>
            <span class="button-label">打开打印预览</span>
          </button>
          <button id="printButton" class="button button-primary" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
              />
              <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
              <rect x="6" y="14" width="12" height="8" rx="1" />
            </svg>
            <span class="button-label">测试打印</span>
          </button>
        </div>
      </header>

      <section class="workspace">
        <aside class="inspector">
          <section class="panel-section">
            <div class="section-heading">
              <h2>元素</h2>
              <span id="elementCount">2 个</span>
            </div>
            <div class="add-actions">
              <button id="addText" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 4v16" />
                  <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2" />
                  <path d="M9 20h6" />
                </svg>
                添加文字
              </button>
              <button id="addImage" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 5h6" />
                  <path d="M19 2v6" />
                  <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" />
                  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                  <circle cx="9" cy="9" r="2" />
                </svg>
                添加图片
              </button>
              <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            </div>
          </section>

          <section class="panel-section remote-fonts-section">
            <div class="section-heading">
              <div>
                <h2>远程字体</h2>
                <span id="remoteFontCount">0 个</span>
              </div>
              <div class="section-heading-actions">
                <button
                  id="clearFontCache"
                  class="section-action section-action-muted"
                  type="button"
                >
                  清空缓存
                </button>
                <button id="addRemoteFont" class="section-action" type="button">添加字体</button>
              </div>
            </div>
            <p class="section-description">首次下载后保存到本机，后续预览与打印使用缓存。</p>
            <div id="remoteFontList" class="remote-font-list"></div>
          </section>

          <section class="panel-section layers-section">
            <div class="section-heading">
              <h2>图层</h2>
              <span>点击切换</span>
            </div>
            <div id="elementList" class="element-list"></div>
          </section>

          <section id="propertiesSection" class="panel-section properties-section">
            <div class="section-heading">
              <h2>元素属性</h2>
              <button id="deleteElement" class="delete-button" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                  <path d="M3 6h18" />
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
                <span>删除</span>
              </button>
            </div>
            <div id="propertyForm" class="form-grid property-grid"></div>
          </section>
        </aside>

        <section id="stage" class="stage" aria-label="打印纸张预览">
          <div class="ruler-corner" aria-hidden="true">mm</div>
          <div id="rulerX" class="ruler ruler-x" aria-hidden="true"></div>
          <div id="rulerY" class="ruler ruler-y" aria-hidden="true"></div>
          <div id="canvasToolbar" class="canvas-toolbar" aria-label="选中元素快速定位">
            <span>元素定位</span>
            <div class="toolbar-group">
              <button type="button" data-position="left" aria-label="左对齐纸张" title="左对齐纸张">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4 3v14M7 6h8M7 10h5M7 14h7" />
                </svg>
              </button>
              <button
                type="button"
                data-position="horizontal"
                aria-label="水平居中"
                title="水平居中"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M10 3v14M5 6h10M7 10h6M6 14h8" />
                </svg>
              </button>
              <button
                type="button"
                data-position="right"
                aria-label="右对齐纸张"
                title="右对齐纸张"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M16 3v14M5 6h8M8 10h5M6 14h7" />
                </svg>
              </button>
            </div>
            <div class="toolbar-divider" aria-hidden="true"></div>
            <div class="toolbar-group">
              <button
                type="button"
                data-position="top"
                aria-label="顶部对齐纸张"
                title="顶部对齐纸张"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3 4h14M6 7v8M10 7v5M14 7v7" />
                </svg>
              </button>
              <button type="button" data-position="vertical" aria-label="垂直居中" title="垂直居中">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3 10h14M6 5v10M10 7v6M14 6v8" />
                </svg>
              </button>
              <button
                type="button"
                data-position="bottom"
                aria-label="底部对齐纸张"
                title="底部对齐纸张"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3 16h14M6 5v8M10 8v5M14 6v7" />
                </svg>
              </button>
            </div>
            <div class="toolbar-divider" aria-hidden="true"></div>
            <button
              type="button"
              data-position="center"
              aria-label="移动到页面中心"
              title="移动到页面中心"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M10 3v14M3 10h14M6 6h8v8H6z" />
              </svg>
            </button>
          </div>
          <div id="textAlignToolbar" class="text-align-toolbar" aria-label="文字对齐方式" hidden>
            <span>文字对齐</span>
            <div class="toolbar-group" aria-label="水平对齐">
              <button
                type="button"
                data-text-align="left"
                aria-label="文字左对齐"
                title="文字左对齐"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4 3v14M7 6h8M7 10h5M7 14h7" />
                </svg>
              </button>
              <button type="button" data-text-align="center" aria-label="文字居中" title="文字居中">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M10 3v14M5 6h10M7 10h6M6 14h8" />
                </svg>
              </button>
              <button
                type="button"
                data-text-align="right"
                aria-label="文字右对齐"
                title="文字右对齐"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M16 3v14M5 6h8M8 10h5M6 14h7" />
                </svg>
              </button>
            </div>
            <div class="toolbar-divider" aria-hidden="true"></div>
            <div class="toolbar-group" aria-label="垂直对齐">
              <button
                type="button"
                data-vertical-align="top"
                aria-label="文字顶部对齐"
                title="文字顶部对齐"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3 4h14M6 7v8M10 7v5M14 7v7" />
                </svg>
              </button>
              <button
                type="button"
                data-vertical-align="middle"
                aria-label="文字垂直居中"
                title="文字垂直居中"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3 10h14M6 5v10M10 7v6M14 6v8" />
                </svg>
              </button>
              <button
                type="button"
                data-vertical-align="bottom"
                aria-label="文字底部对齐"
                title="文字底部对齐"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3 16h14M6 5v8M10 8v5M14 6v7" />
                </svg>
              </button>
            </div>
          </div>
          <div id="paper" class="paper"></div>
          <div id="paperMeta" class="paper-meta">—</div>
          <div class="stage-help">点击元素选择 · 拖动调整位置</div>
        </section>
      </section>
    </main>
    <script src="/mprint.js"></script>
    <script type="module" src="/editor/editor.js"></script>
  </body>
</html>
